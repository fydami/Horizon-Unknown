<body>

<div id="stage"><div id="world"><svg id="lk" width="1" height="1"></svg><div id="nodes"></div></div></div>

  <div id="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M2 12V2h10M28 2h10v10M38 28v10H28M12 38H2V28" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="20" cy="20" r="10" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M20 5v10M20 25v10M5 20h10M25 20h10" stroke="currentColor" stroke-width="1.4"/><circle class="sun" cx="20" cy="20" r="2.4"/></svg><div><b>HORIZON</b><i>unknown</i></div></div>
  <div id="tabs"><i id="tabind"></i><button data-tab="home" class="on">Главная</button><button data-tab="graph">Граф</button><button data-tab="char">Персонажи</button><button data-tab="org">Организации</button><button data-tab="story">Истории</button><button data-tab="time">Таймлайн</button></div>
  <div id="newwrap"><button id="b-new">+ Создать</button><div id="newmenu"><button data-add="char">Персонаж</button><button data-add="org">Организация</button><button data-add="story">История</button></div></div>
  <button id="b-flt">Фильтры</button><span class="sp"></span>
  <button id="b-lay">Разложить</button><button id="b-fit">Вместить</button><button id="b-zo">−</button><button id="b-zi">+</button>
  <button id="b-theme">Тема</button><button id="b-data">Данные</button>
</div>
<div id="home"><div id="hwrap"><div id="hcanvas"></div></div></div>
<div id="hbar"><button class="pri" id="h-build">Конструктор</button><span class="hadd"><button data-hadd="title">+ Заголовок</button><button data-hadd="text">+ Текст</button><button data-hadd="image">+ Картинка</button><button data-hadd="quote">+ Цитата</button><button data-hadd="stat">+ Цифра</button><button data-hadd="button">+ Кнопка</button></span></div>

<div id="list"></div>
<div id="legend"><span style="--c:var(--c-char)">Персонажи</span><span style="--c:var(--c-org)">Организации</span><span style="--c:var(--c-story)">Истории</span></div>
<div class="ov" id="ov"><div class="panel" id="panel"></div></div>
<script>
let OWN=false;try{OWN=localStorage.getItem('hu-owner')==='1'}catch(e){}
if(!OWN&&location.hash.startsWith('#edit=')&&window.crypto&&crypto.subtle){crypto.subtle.digest('SHA-256',new TextEncoder().encode(decodeURIComponent(location.hash.slice(6)))).then(b=>{const x=[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('');if(x==='b717c2c85e674314fdc4a1ee9e5ec1d63dbb3a457d00487c873db291462ed24b'){try{localStorage.setItem('hu-owner','1')}catch(e){}}location.replace(location.pathname+location.search)})}
const VIEW=location.search.includes('view')||(/\.github\.io$/.test(location.hostname)&&!OWN);
if(VIEW)document.documentElement.classList.add('view');
const KEY="hu-hub-v1",$=s=>document.querySelector(s),T={char:"Персонаж",org:"Организация",story:"История"};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini=s=>(s||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
let S,cur=null,view={x:0,y:0,k:1},saveT;
const byId=id=>S.nodes.find(n=>n.id===id);

function seed(){
  const N=(id,type,name,sub,short,long="",quote="")=>({id,type,name,sub,short,long,quote,img:"",x:Math.cos(id.length*7+name.length)*300+Math.random()*200,y:Math.sin(name.length*3)*300+Math.random()*200});
  const nodes=[
    N("niko","char","Niko Weisez","Vol. 1","Бывший хирург-травматолог, ставший спецоператором. Хранит карты close to chest.","Former trauma surgeon, turned special operator, haunted by a ghost he once saved. Hunted by the shadows of San Fierro.","neither here nor there"),
    N("ezik","char","Ezikiel Yang Stewart","Vol. 2","Федеральный оперативник со спокойствием, которое не доходит до рук.","Joined the Office because the benefits were good — but stayed because he discovered he was good at the work.","I wasn’t sent to help. I was sent to clean up."),
    N("lis","char","Елисей Антропов","Лис · Грех · Фокс","Статус неизвестен. Есть непроверенная информация.","","В России говорят, что вор должен сидеть в тюрьме. В Америке — что вор должен платить. Я и там, и там не вписался."),
    N("nath","char","Nathaniel Johannsson","FSK Jaegers","Последний из троих на обложке Vol. 5.","","" ),
    N("gold","char","Agent Gold","Kontrol Group PMC","Улыбается так, будто всё уже решено.","","" ),
    N("escal","char","Escal Delacroix","The Art of Lie","Герой Vol. 6.","","Some lies save lives. Others end them."),
    N("sey","char","Seymour Abernathy","The Art of Lie","Герой Vol. 6, постарше и пострашнее.","",""),
    N("fsk","org","FSK Jaegers","Спецподразделение","Разведывательно-диверсионная группа. Hazlim Nazari и Dar Koval вычеркнуты.","",""),
    N("kg","org","Kontrol Group","PMC","Частная военная компания.","",""),
    N("office","org","The Office","Федеральная служба","Организация, куда пришёл Ezikiel.","",""),
    N("v1","story","Vol. 1 · Horizon","Season 1","История Niko Weisez.","",""),
    N("v2","story","Vol. 2 · Horizon","Season 1","История Ezikiel Yang Stewart.","",""),
    N("v3","story","Vol. 3 · Неверный","Season 1","История Елисея Антропова.","",""),
    N("v5","story","Vol. 5 · Neither Here Nor There","Season 1","FSK Jaegers.","",""),
    N("v6","story","Vol. 6 · The Art of Lie","Season 1","Escal Delacroix и Seymour Abernathy.","",""),
    N("v7","story","Vol. 7 · De-classified","Season 1","Agent Gold, Kontrol Group PMC.","","")
  ];
  const L=(a,b,label)=>({id:uid(),a,b,label});
  return{nodes,links:[L("niko","v1","главный герой"),L("ezik","v2","главный герой"),L("lis","v3","главный герой"),L("nath","v5","главный герой"),L("fsk","v5","отряд"),L("nath","fsk","служит"),L("escal","v6","герой"),L("sey","v6","герой"),L("escal","sey","противостояние"),L("gold","v7","герой"),L("gold","kg","работает на"),L("kg","v7","тема"),L("ezik","office","агент"),L("office","v2","тема")]};
}
function load(){if(VIEW){S={nodes:[],links:[],home:{blocks:[]},events:[]};return false}try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return false}}catch(e){}S=seed();return true}
function save(){if(VIEW)return;clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},250)}

function render(){
  $("#nodes").innerHTML=S.nodes.map((n,i)=>`<div class="node ${n.type}" data-id="${n.id}" style="animation-delay:${i*45}ms"><div class="ph">${n.img?`<img src="${n.img}" alt="">`:`<span>${esc(ini(n.name))}</span>`}</div><div class="tx"><b>${esc(n.name)}</b><i>${esc(n.sub)}</i><p>${esc(n.short)}</p></div>${stp(n)}</div>`).join("");
  pos();
}
function pos(){
  document.querySelectorAll(".node").forEach(e=>{const n=byId(e.dataset.id);if(n){e.style.left=n.x+"px";e.style.top=n.y+"px"}});
  drawLinks();
}
function drawLinks(){
  const m=new Map(S.nodes.map(n=>[n.id,n]));let h="";
  S.links.forEach(l=>{const a=m.get(l.a),b=m.get(l.b);if(!a||!b)return;
    const dx=b.x-a.x,dy=b.y-a.y,cx=(a.x+b.x)/2-dy*.12,cy=(a.y+b.y)/2+dx*.12,mx=(a.x+b.x)/4+cx/2,my=(a.y+b.y)/4+cy/2;
    h+=`<g class="lnk${lf(l,a,b)}" style="${lk(l)}" data-a="${l.a}" data-b="${l.b}"><path d="M${a.x} ${a.y}Q${cx} ${cy} ${b.x} ${b.y}"/>${l.label?`<text x="${mx}" y="${my}">${esc(l.label)}</text>`:""}</g>`});
  $("#lk").innerHTML=h;
}
function focusNode(id){
  const w=$("#world");w.classList.toggle("focus",!!id);
  const rel=new Set([id]);S.links.forEach(l=>{if(l.a===id)rel.add(l.b);if(l.b===id)rel.add(l.a)});
  document.querySelectorAll(".node").forEach(e=>e.classList.toggle("on",!!id&&rel.has(e.dataset.id)));
  document.querySelectorAll(".lnk").forEach(e=>e.classList.toggle("on",!!id&&(e.dataset.a===id||e.dataset.b===id)));
}
$("#nodes").addEventListener("pointerover",e=>{const n=e.target.closest(".node");if(n&&!drag)focusNode(n.dataset.id)});
$("#nodes").addEventListener("pointerout",e=>{if(!drag&&e.target.closest(".node"))focusNode(null)});

/* view */
function applyView(){
  $("#world").style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;
  const st=$("#stage").style;st.backgroundPosition=`${view.x}px ${view.y}px`;st.backgroundSize=`${32*view.k}px ${32*view.k}px`;$("#bg").style.transform=`translate(${view.x*.02}px,${view.y*.02}px)`;
}
function fit(){
  if(!S.nodes.length)return;
  const xs=S.nodes.map(n=>n.x),ys=S.nodes.map(n=>n.y),W=innerWidth,H=innerHeight;
  const x0=Math.min(...xs)-150,x1=Math.max(...xs)+150,y0=Math.min(...ys)-200,y1=Math.max(...ys)+200;
  view.k=Math.min(W/(x1-x0),H/(y1-y0),1.1);
  view.x=W/2-(x0+x1)/2*view.k;view.y=H/2-(y0+y1)/2*view.k;
  const w=$("#world");w.style.transition="transform .6s cubic-bezier(.3,.8,.3,1)";applyView();setTimeout(()=>w.style.transition="",650);
}
function zoomAt(f,cx,cy){const k=Math.max(.2,Math.min(2.5,view.k*f)),r=k/view.k;view.x=cx-(cx-view.x)*r;view.y=cy-(cy-view.y)*r;view.k=k;applyView()}
$("#stage").addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.1:.91,e.clientX,e.clientY)},{passive:false});
$("#b-zi").onclick=()=>zoomAt(1.25,innerWidth/2,innerHeight/2);
$("#b-zo").onclick=()=>zoomAt(.8,innerWidth/2,innerHeight/2);
$("#b-fit").onclick=fit;

/* drag + click */
let drag=null;const stage=$("#stage");
stage.addEventListener("pointerdown",e=>{
  const el=e.target.closest(".node"),n=el&&byId(el.dataset.id);
  drag={n,sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,ox:n&&n.x,oy:n&&n.y,moved:0,el};
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove",e=>{
  if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;drag.moved=Math.max(drag.moved,Math.hypot(dx,dy));
  if(drag.n){if(drag.moved>4){drag.n.x=drag.ox+dx/view.k;drag.n.y=drag.oy+dy/view.k;pos()}}
  else{view.x=drag.vx+dx;view.y=drag.vy+dy;applyView()}
});
stage.addEventListener("pointerup",()=>{
  if(!drag)return;const d=drag;drag=null;
  if(d.n){if(d.moved<5)show(d.n.id,d.el);else save()}
});

/* layout */
function layout(anim){
  const N=S.nodes,P=N.map(n=>({x:n.x,y:n.y})),idx=new Map(N.map((n,i)=>[n.id,i]));
  for(let it=0;it<400;it++){
    const F=N.map(()=>[0,0]);
    for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
      let dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2),f=140000/d2;
      F[i][0]+=dx/d*f;F[i][1]+=dy/d*f;F[j][0]-=dx/d*f;F[j][1]-=dy/d*f}
    S.links.forEach(l=>{const i=idx.get(l.a),j=idx.get(l.b);if(i==null||j==null)return;
      const dx=P[j].x-P[i].x,dy=P[j].y-P[i].y,d=Math.hypot(dx,dy)||1,f=(d-270)*.02;
      F[i][0]+=dx/d*f;F[i][1]+=dy/d*f;F[j][0]-=dx/d*f;F[j][1]-=dy/d*f});
    N.forEach((n,i)=>{P[i].x+=(F[i][0]-P[i].x*.01)*.6;P[i].y+=(F[i][1]-P[i].y*.01)*.6})}
  if(!anim){N.forEach((n,i)=>{n.x=P[i].x;n.y=P[i].y});return}
  const from=N.map(n=>({x:n.x,y:n.y})),t0=performance.now();
  (function step(t){const p=Math.min(1,(t-t0)/800),e=1-Math.pow(1-p,3);
    N.forEach((n,i)=>{n.x=from[i].x+(P[i].x-from[i].x)*e;n.y=from[i].y+(P[i].y-from[i].y)*e});pos();
    if(p<1)requestAnimationFrame(step);else{save();fit()}})(t0);
}
$("#b-lay").onclick=()=>layout(true);

/* panel */
function openPanel(html,type,origin){
  const ov=$("#ov"),p=$("#panel");p.className="panel "+type;p.innerHTML=html;ov.style.display="flex";
  const r=p.getBoundingClientRect(),o=origin||{x:innerWidth/2,y:innerHeight/2};
  p.style.transformOrigin=`${o.x-r.left}px ${o.y-r.top}px`;void p.offsetWidth;ov.classList.add("open");
}
function closePanel(){const ov=$("#ov");ov.classList.remove("open");setTimeout(()=>{if(!ov.classList.contains("open"))ov.style.display="none"},320);cur=null;render()}
function show(id,el){
  const n=byId(id);if(!n)return;cur=id;
  const rel=S.links.filter(l=>l.a===id||l.b===id).map(l=>({l,o:byId(l.a===id?l.b:l.a)})).filter(r=>r.o);
  let o;if(el){const b=el.getBoundingClientRect();o={x:b.left+b.width/2,y:b.top+b.height/2}}
  openPanel(`<div class="pv"><div class="big">${n.img?`<img src="${n.img}" alt="">`:esc(ini(n.name))}${stp(n)}</div><div class="body"><div class="kind">${T[n.type]}</div><h2>${esc(n.name)}</h2><div class="sub">${esc(n.sub)}</div>
  ${n.quote?`<blockquote>“${esc(n.quote)}”</blockquote>`:""}<div>${esc(n.long||n.short).replace(/\n/g,"<br>")}</div>
  ${rel.length?`<h4>Связи</h4><div>${rel.map(r=>`<button class="chip" data-go="${r.o.id}">${esc(r.o.name)}${r.l.label?`<em>${esc(r.l.label)}</em>`:""}</button>`).join("")}</div>`:""}
  <div class="act"><button data-edit="${id}">Редактировать</button><button data-close>Закрыть</button></div></div></div>`,n.type,o);
}
function edit(id){
  const n=byId(id);cur=id;

/* redaction */
function redact(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:t=>/\[\[.+?\]\]/.test(t.data)&&!t.parentElement.closest('textarea,input,script,style,.rd')?1:3}),L=[];while(w.nextNode())L.push(w.currentNode);
 L.forEach(t=>{const f=document.createDocumentFragment();t.data.split(/(\[\[.+?\]\])/).forEach(p=>{const m=/^\[\[(.+?)\]\]$/.exec(p);if(m){const s=document.createElement('span');s.className='rd';s.textContent=m[1];f.appendChild(s)}else if(p)f.appendChild(document.createTextNode(p))});t.replaceWith(f)})}
const mo=new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)redact(n)})));

const stp=n=>(n.stamps||[]).map(s=>`<b class='stp' data-sid='${s.id}' style='left:${s.x}%;top:${s.y}%;color:${s.c};border-color:${s.c};font-size:${s.s}px;transform:translate(-50%,-50%) rotate(${s.r}deg)'>${esc(s.t)}</b>`).join('');
let curSt=null,sd=null;
function stpEdit(id){const n=byId(id);curSt=id;n.stamps=n.stamps||[];$('#panel').className='panel '+n.type;
 $('#panel').innerHTML=`<div class='ed'><h4 style='margin:0'>Штампы: ${esc(n.name)}</h4><div style='color:var(--mute)'>Перетащите штамп прямо на карточке. Надпись можно выбрать из списка или написать свою.</div><datalist id='stl'>${STP.map(s=>`<option value='${s}'>`).join('')}</datalist>
 <div class='plc'><div class='node ${n.type}' style='position:relative;left:auto;top:auto;transform:none;animation:none;pointer-events:none'><div class='ph'>${n.img?`<img src='${n.img}' alt=''>`:`<span>${esc(ini(n.name))}</span>`}</div><div class='tx'><b>${esc(n.name)}</b><i>${esc(n.sub)}</i><p>${esc(n.short)}</p></div></div><div class='plcs'>${stp(n)}</div></div>
 ${n.stamps.map(s=>`<div class='mrow s'><input data-st='t' data-i='${s.id}' list='stl' value="${esc(s.t)}"><select data-st='c' data-i='${s.id}'>${Object.entries(SC).map(([k,v])=>`<option value='${v}'${v===s.c?' selected':''}>${k}</option>`).join('')}</select><input type='range' data-st='r' data-i='${s.id}' min='-45' max='45' value='${s.r}'><input type='range' data-st='s' data-i='${s.id}' min='11' max='38' value='${s.s}'><button data-sdel='${s.id}'>×</button></div>`).join('')}
 <div class='act'><button data-sadd>+ Штамп</button><button class='pri' data-sback>Назад</button></div></div>`}
$('#panel').addEventListener('pointerdown',e=>{const s=e.target.closest('.plc .stp');if(!s)return;e.preventDefault();sd={s,n:byId(curSt),r:s.closest('.plc').getBoundingClientRect()};s.setPointerCapture(e.pointerId)});
$('#panel').addEventListener('pointermove',e=>{if(!sd)return;const st=sd.n.stamps.find(x=>x.id===sd.s.dataset.sid),c=(v,a,b)=>Math.round(Math.max(0,Math.min(100,(v-a)/b*100)));st.x=c(e.clientX,sd.r.left,sd.r.width);st.y=c(e.clientY,sd.r.top,sd.r.height);sd.s.style.left=st.x+'%';sd.s.style.top=st.y+'%'});

/* org structures */
const PRE={crime:{n:'Крайм-структура',r:['Босс','Заместитель','Консильери','Капо','Солдат','Ассоциат']},pmc:{n:'ЧВК / частная структура',r:['Директор','Операционный директор','Руководитель отдела','Командир группы','Оператор','Аналитик','Логист']},state:{n:'Государственная структура',r:['Директор','Заместитель директора','Начальник отдела','Старший агент','Агент']},cells:{n:'Сеть ячеек',r:['Куратор','Лидер ячейки','Участник']}};
function structHTML(n){
 const M=n.members||[],P=n.preset||'state',ids=new Set(M.map(m=>m.id)),kids=p=>M.filter(m=>(ids.has(m.parent)&&m.parent!==m.id?m.parent:'')===p);
 if(!M.length)return`<p style='color:var(--mute)'>Состав пока не задан.</p>`;
 const card=(m,st)=>`<div class='sm' ${m.nid&&byId(m.nid)?`data-nid='${m.nid}'`:''} style='${st||''}'><b>${esc(m.name)}</b><i>${esc(m.role)}</i></div>`;
 if(P==='cells')return`<div class='cells'>`+kids('').map(r=>{const all=[],w=x=>kids(x.id).forEach(c=>{all.push(c);w(c)});w(r);return`<div class='cell'>${card(r)}<div style='display:grid;gap:6px'>${all.map(c=>card(c)).join('')}</div></div>`}).join('')+`</div>`;
 const W=170,H=60,GX=20,GY=P==='pmc'?60:50,hor=P==='pmc',pos={};let leaf=0,dm=0;
 const walk=(m,d)=>{dm=Math.max(dm,d);const k=kids(m.id);if(!k.length){pos[m.id]={d,s:leaf++};return}k.forEach(c=>walk(c,d+1));pos[m.id]={d,s:(pos[k[0].id].s+pos[k[k.length-1].id].s)/2}};
 kids('').forEach(r=>walk(r,0));const ms=M.filter(m=>pos[m.id]);
 const X=m=>hor?pos[m.id].d*(W+GY+30):pos[m.id].s*(W+GX),Y=m=>hor?pos[m.id].s*(H+GX):pos[m.id].d*(H+GY),tw=hor?(dm+1)*(W+GY+30):leaf*(W+GX),th=hor?leaf*(H+GX):(dm+1)*(H+GY);
 const L=ms.filter(m=>pos[m.parent]).map(m=>{const p=M.find(x=>x.id===m.parent),a=hor?[X(p)+W,Y(p)+H/2]:[X(p)+W/2,Y(p)+H],b=hor?[X(m),Y(m)+H/2]:[X(m)+W/2,Y(m)],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
  return`<path d='${P==='crime'?`M${a} C${a[0]} ${my} ${b[0]} ${my} ${b}`:hor?`M${a}H${mx}V${b[1]}H${b[0]}`:`M${a}V${my}H${b[0]}V${b[1]}`}'/>`}).join('');
 return`<div class='st st-${P}' style='width:${tw}px;height:${th}px'><svg width='${tw}' height='${th}'>${L}</svg>${ms.map(m=>card(m,`left:${X(m)}px;top:${Y(m)}px`)).join('')}</div>`}
const structBlock=n=>`<h4>Структура</h4><div class='row' style='margin-bottom:10px'><select data-spreset='${n.id}' style='width:auto'>${Object.entries(PRE).map(([k,v])=>`<option value='${k}'${k===(n.preset||'state')?' selected':''}>${v.n}</option>`).join('')}</select><button data-stedit='${n.id}'>Редактировать состав</button></div><div class='stwrap'>${structHTML(n)}</div>`;
let curS=null;
function stEdit(id){const n=byId(id);curS=id;const ms=n.members=n.members||[],ch=S.nodes.filter(x=>x.type==='char');$('#panel').className='panel org';
 $('#panel').innerHTML=`<div class='ed'><h4 style='margin:0'>Структура: ${esc(n.name)}</h4><div style='color:var(--mute)'>Укажите, кому подчиняется каждый участник. «Корень» — вершина. Можно привязать к карточке персонажа.</div><datalist id='rk'>${PRE[n.preset||'state'].r.map(r=>`<option value='${r}'>`).join('')}</datalist>`+
 ms.map(m=>`<div class='mrow'><input data-m='name' data-i='${m.id}' value="${esc(m.name)}" placeholder='Имя'><input data-m='role' data-i='${m.id}' list='rk' value="${esc(m.role)}" placeholder='Звание'><select data-m='parent' data-i='${m.id}'><option value=''>— корень —</option>${ms.filter(x=>x.id!==m.id).map(x=>`<option value='${x.id}'${x.id===m.parent?' selected':''}>${esc(x.name)}</option>`).join('')}</select><select data-m='nid' data-i='${m.id}'><option value=''>— без карточки —</option>${ch.map(x=>`<option value='${x.id}'${x.id===m.nid?' selected':''}>${esc(x.name)}</option>`).join('')}</select><button data-mdel='${m.id}'>×</button></div>`).join('')+
 `<div class='act'><button data-madd>+ Участник</button><button class='pri' data-mdone>Готово</button></div></div>`}

/* timeline */
const seedEv=()=>[{id:uid(),date:'2017.26.07',title:'Операция, после которой Ezikiel остаётся с виной',text:'Прошлая операция оставила молодую женщину мёртвой. Пример: нажмите ✎, чтобы изменить.',accent:'char',refs:['ezik','office']},{id:uid(),date:'2019.00.00',title:'Пример события',text:'Часть текста можно [[скрыть двойными скобками]].',accent:'org',refs:['fsk']},{id:uid(),date:'2021.00.00',title:'Ещё одно событие',text:'Добавляйте свои кнопкой «+ Событие».',accent:'story',refs:[]}];
const evm=e=>(!F.q||(e.date+' '+e.title+' '+e.text).toLowerCase().includes(F.q))&&(!F.rel||e.refs.includes(F.rel));
function renderTL(){if(tab!=='time')return;
 const E=(S.events||(S.events=seedEv())).filter(evm).sort((a,b)=>a.date.localeCompare(b.date,undefined,{numeric:true}));
 $('#tltrack').style.width=Math.max(innerWidth,E.length*250+340)+'px';
 $('#tltrack').innerHTML=`<div class='axis'></div>`+(E.map((e,i)=>`<div class='ev ${i%2?'dn':'up'} a-${e.accent}' data-id='${e.id}' style='left:${170+i*250}px;animation-delay:${i*60}ms'><i class='dot'></i><span class='dt'>${esc(e.date)}</span><div class='card'><b>${esc(e.title)}</b><div class='more2'><p style='margin:0 0 8px'>${esc(e.text).replace(/\n/g,'<br>')}</p>${e.refs.map(r=>byId(r)).filter(Boolean).map(n=>`<button class='chip' data-go='${n.id}'>${esc(n.name)}</button>`).join('')}<button class='chip' data-evedit='${e.id}'>✎</button></div></div></div>`).join('')||`<p style='position:absolute;left:30px;top:50%;color:var(--mute)'>Событий нет. Добавьте первое кнопкой «+ Событие».</p>`)}
const tl=$('#tl');let td=null,curE=null;
tl.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){tl.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});

tl.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.go)go(b.dataset.go);else if(b.dataset.evedit)evEdit(b.dataset.evedit);return}const c=e.target.closest('.ev .card');if(c)c.parentElement.classList.toggle('open')});
$('#tbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tls)tl.scrollBy({left:+b.dataset.tls*innerWidth*.7,behavior:'smooth'});else if(b.id==='t-add'){const ev={id:uid(),date:'',title:'Новое событие',text:'',accent:'char',refs:[]};(S.events||(S.events=seedEv())).push(ev);save();evEdit(ev.id)}});
function evEdit(id){const e=S.events.find(x=>x.id===id);if(!e)return;curE=id;const ac=[['char','Красный'],['org','Синий'],['story','Янтарный'],['ink','Нейтральный']];

/* panel handlers */
const gE=()=>S.events.find(x=>x.id===curE);
$('#panel').addEventListener('input',e=>{const d=e.target.dataset;

 else if(d.st&&curSt){const n=byId(curSt),s=n.stamps.find(x=>x.id===d.i);if(s){s[d.st]=['r','s'].includes(d.st)?+e.target.value:e.target.value;save();$('.plcs').innerHTML=stp(n)}}});
$('#panel').addEventListener('change',e=>{const d=e.target.dataset;

$('#panel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if('stamps'in d)stpEdit(cur);

 else if('madd'in d){byId(curS).members.push({id:uid(),name:'Новый участник',role:'',parent:'',nid:''});save();stEdit(curS)}
 else if(d.mdel){const n=byId(curS);n.members=n.members.filter(m=>m.id!==d.mdel);n.members.forEach(m=>{if(m.parent===d.mdel)m.parent=''});save();stEdit(curS)}
